name: CI Pipeline & Automated Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Build, Validate Spec & Execute Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate YAML Annotation Specification
        run: |
          python pipeline/validate_spec.py schemas/annotation.yaml

      - name: Run Pytest Automated Test Suite
        run: |
          pytest --cov=. --cov-report=term-missing

      - name: Verify End-to-End Pipeline Execution & Idempotency
        run: |
          python scripts/generate_dataset.py --num-tasks 40 --seed 42
          python scripts/simulate_annotations.py --count 35 --seed 42
          python scripts/run_pipeline.py
          python scripts/run_pipeline.py
