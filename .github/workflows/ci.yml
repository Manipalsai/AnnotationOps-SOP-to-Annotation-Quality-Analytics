name: CI — Automated Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate SOP schema contract
        run: python pipeline/validate_spec.py schemas/annotation.yaml

      - name: Generate dataset and populate warehouse (required by DB-dependent tests)
        run: |
          python scripts/generate_dataset.py --num-assets 500 --seed 42
          python scripts/simulate_annotations.py --count 600 --seed 42
          python scripts/run_pipeline.py

      - name: Run full test suite (59 tests)
        run: pytest tests/ -v --tb=short

      - name: Verify pipeline idempotency (re-run must not duplicate records)
        run: |
          python scripts/run_pipeline.py
